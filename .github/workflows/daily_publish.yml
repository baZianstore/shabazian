name: النشر الطبي اليومي

on:
  schedule:
    # GitHub Actions evaluates cron in UTC. Jerusalem is UTC+2 or UTC+3; the
    # application gate accepts only the 08:00 local request and absorbs the
    # other, so daylight-saving changes do not require editing this workflow.
    - cron: "0 5,6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: استدعاء مهمة النشر الآمنة
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$SCHEDULER_SECRET"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --max-time 180 \
            -X POST "${APP_URL%/}/tasks/daily-publish" \
            -H "Authorization: Bearer ${SCHEDULER_SECRET}" \
            -H "Content-Type: application/json"
